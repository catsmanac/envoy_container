[project]
name = "envoy_container"
version = "0.1.0"
description = "Envoy data simulator in docker container"
authors = [
    {name = "Arie Catsman",email = "catsmanac@outlook.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask[async] (>=3.1.3,<4.0.0)",
    "flask-sslify (>=0.1.5,<0.2.0)",
    "pyopenssl (>=26.4.0,<27.0.0)",
    "awesomeversion (>=25.8.0,<26.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "flask-socketio (>=5.6.1,<6.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "markdown (>=3.10.2,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"


[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
ignore = [
    "D417", # Missing argument descriptions in the docstring
]
select = [
    "B",   # flake8-bugbear
    "D",   # flake8-docstrings
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit
    "F",   # pyflake
    "E",   # pycodestyle
    "W",   # pycodestyle
    "UP",  # pyupgrade
    "I",   # isort
    "RUF", # ruff specific
    "SIM", # flake8-simplify
    "PERF", # perflint
    "FURB", # refurb
    "RET", # flake8-return
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "S101",
]
"setup.py" = ["D100"]
"conftest.py" = ["D100"]
"docs/conf.py" = ["D100"]

[tool.ruff.lint.isort]
known-first-party = ["pyenphase", "tests"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = [
    'docs/.*',
    'setup.py',
]

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true